[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mervio"
version = "0.1.0"
description = "Mervio core analytics engine - deterministic e-commerce business intelligence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "moto>=5,<6"]
# Mission 004.1: persistance PostgreSQL. Jamais requise par le moteur ni par la CLI.
persistence = ["psycopg[binary]>=3.2,<4", "alembic>=1.13,<2"]
# Mission 004.4.4 (D-055): pilote ObjectStore compatible S3. Extra OPTIONNEL, importe a la
# demande; choisir le pilote `s3` sans cet extra est une erreur de configuration.
s3 = ["boto3>=1.34,<2"]

[project.scripts]
mervio = "mervio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mervio.persistence" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
