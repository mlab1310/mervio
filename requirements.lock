# Versions EXACTES de l'environnement de test et d'execution (Mission 004.3).
# Utilise par la CI (et par l'image conteneur en 004.3.8):
#     python -m pip install --no-deps -r requirements.lock
# Contraintes de haut niveau: requirements.txt et pyproject.toml. Fermeture transitive et
# correspondance avec l'environnement installe: tests/test_requirements_lock.py.
# greenlet: exige par SQLAlchemy sur Linux x86_64/aarch64 (marqueur recopie de SQLAlchemy 2.0.53).
# boto3 (extra [s3], D-055) et moto (test du pilote S3, en processus): leur fermeture
# transitive figure ci-dessous. certifi est MPL-2.0, accepte APRES REVUE pour cette
# distribution nommee seulement (scripts/ci_license_check.py, D-061).
# jsonschema (K-1, Report Contract 2.0): validation du schema en TEST uniquement;
# sa fermeture transitive (attrs, referencing, rpds-py, jsonschema-specifications)
# figure ci-dessous. Absente de requirements-runtime.lock: aucune dependance runtime.
# 004.6 (D-105): cloture de l'extra `api`. `fastapi` exige `opentelemetry-api` en dependance
# DURE depuis 0.143: c'est l'API de tracage seule, sans exporteur ni reseau tant que rien
# n'est configure -- signale ici parce que ce n'est pas evident depuis `fastapi`.
# `annotated-doc` et `typing-inspection` viennent de `fastapi`/`pydantic`. `httpx` et
# `httpcore` sont de TEST uniquement (`fastapi.testclient`): absents de
# `requirements-runtime.lock`. `exceptiongroup`, exige par `anyio`, est exclu par son
# marqueur sur Python 3.11.
# 004.6 tranche F (D-098a): `pyjwt` verifie les jetons OIDC. Zero dependance runtime sur
# Python 3.11 (`typing_extensions` n'est exige que sous 3.11). Son extra `crypto` tire
# `cryptography`, deja present ci-dessous via `moto`: RS256 et ES256 en dependent.
